<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas y Gestión de Turnos</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar glass">
    <div class="logo">BarberApp SaaS</div>
    <div class="nav-links">
      <button id="btn-nav-client" class="active">Agendar Cita</button>
      <button id="btn-nav-admin">Panel Admin</button>
    </div>
  </nav>

  <main id="app-container">
    <section id="view-client" class="view active">
      <div class="glass card form-container">
        <h1>Agenda tu cita</h1>
        <form id="booking-form">
          <div class="form-group">
            <label for="servicio">Servicio a realizar</label>
            <select id="servicio" required>
              <option value="" disabled selected>Selecciona un servicio</option>
              <option value="Corte Clásico" data-price="15">Corte Clásico - $15 (30 min)</option>
              <option value="Barba Completa" data-price="10">Barba Completa - $10 (30 min)</option>
              <option value="Combo VIP" data-price="20">Combo VIP - $20 (1 hora)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fecha">Fecha de reserva</label>
            <input type="date" id="fecha" required>
          </div>
          <div class="form-group">
            <label>Horarios Disponibles</label>
            <div id="time-slots" class="time-grid"></div>
          </div>
          <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
          </div>
          <div class="form-group">
            <label for="telefono">Número de Teléfono</label>
            <input type="tel" id="telefono" required placeholder="Ej. +1 234 567 890">
          </div>
          <div class="form-group">
            <label for="notas">Notas Adicionales (Opcional)</label>
            <textarea id="notas" rows="3" placeholder="Detalles o requerimientos especiales..."></textarea>
          </div>
          <button type="submit" id="btn-submit" class="btn-primary">
            <span class="btn-text">Confirmar Reserva</span>
            <div class="spinner hide"></div>
          </button>
        </form>
      </div>
    </section>

    <section id="view-admin" class="view hide">
      <div id="admin-login" class="glass card admin-login">
        <h2>Acceso Administrativo</h2>
        <p>Por favor, ingresa el PIN de seguridad para continuar.</p>
        <input type="password" id="admin-pin" placeholder="****" maxlength="4">
        <button id="btn-login" class="btn-primary">Ingresar al Sistema</button>
      </div>

      <div id="admin-dashboard" class="hide">
        <div class="dashboard-header">
          <h2>Panel de Control en Vivo</h2>
          <div class="filters glass">
            <input type="date" id="filter-date">
            <select id="filter-status">
              <option value="todas">Todas las citas</option>
              <option value="pendiente">Solo Pendientes</option>
              <option value="atendido">Solo Atendidas</option>
              <option value="cancelado">Canceladas</option>
            </select>
          </div>
        </div>
        
        <div class="metrics-grid">
          <div class="metric-card glass">
            <h3>Total Citas del Día</h3>
            <p id="metric-total">0</p>
          </div>
          <div class="metric-card glass">
            <h3>Citas Pendientes</h3>
            <p id="metric-pending">0</p>
          </div>
          <div class="metric-card glass">
            <h3>Ganancia Estimada</h3>
            <p id="metric-revenue">$0</p>
          </div>
        </div>

        <div class="table-container glass">
          <table id="reservations-table">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Contacto</th>
                <th>Servicio</th>
                <th>Fecha y Hora</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="reservations-body">
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-container"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
