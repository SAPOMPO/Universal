<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuctionHub Live - Subastas en Tiempo Real</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
</head>
<body>
    <div id="offline-banner" class="offline-banner hidden">
        <span>Conexión perdida. Intentando reconectar...</span>
    </div>

    <header class="navbar">
        <div class="brand">
            <h1>AuctionHub <span>Live</span></h1>
        </div>
        <div class="nav-controls">
            <span class="active-users"><span id="users-count">0</span> en línea</span>
            <span class="clock" id="global-clock">00:00:00</span>
            <button id="toggle-audio" class="btn-icon">🔊</button>
            <button id="toggle-theme" class="btn-icon">🌓</button>
            <div id="connection-status" class="status-indicator disconnected"></div>
        </div>
    </header>

    <main class="container layout-main">
        <section class="hero">
            <h2>Subastas Exclusivas. Tiempo Real.</h2>
            <div class="filters">
                <input type="text" id="search-input" placeholder="Buscar por nombre o descripción...">
                <select id="category-filter">
                    <option value="all">Todas las categorías</option>
                    <option value="arte">Arte</option>
                    <option value="tecnologia">Tecnología</option>
                    <option value="vehiculos">Vehículos</option>
                </select>
                <select id="status-filter">
                    <option value="all">Todos los estados</option>
                    <option value="active">Activas</option>
                    <option value="paused">Pausadas</option>
                    <option value="closed">Finalizadas</option>
                </select>
            </div>
        </section>

        <div class="grid-layout">
            <section class="products-section">
                <div id="products-container" class="products-grid"></div>
            </section>
            
            <aside class="live-feed">
                <h3>Historial en Vivo</h3>
                <div id="bids-feed-container" class="feed-container"></div>
            </aside>
        </div>
    </main>

    <div id="bid-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modal-product-title">Producto</h3>
            <p>Precio actual: <strong id="modal-current-price">$0</strong></p>
            <form id="bid-form">
                <input type="hidden" id="modal-product-id">
                <input type="text" id="bidder-alias" placeholder="Tu Alias" required autocomplete="off">
                <input type="number" id="bid-amount" placeholder="Monto de la puja" required step="any">
                <button type="submit" class="btn btn-primary full-width">Confirmar Puja</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
